<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>境游 · 餐饮空间全景漫游</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#111827;color:#f8fafc}
.shell{display:flex;height:100dvh}.side{width:290px;flex:none;background:#0b1220;padding:22px 18px;border-right:1px solid #334155;overflow:auto}
.brand{font-size:23px;font-weight:750;letter-spacing:.04em}.sub{font-size:13px;color:#aebbd0;line-height:1.7;margin:9px 0 22px}
.scene{display:block;width:100%;text-align:left;padding:14px 13px;margin:9px 0;border:1px solid #334155;border-radius:12px;background:#172235;color:#f8fafc;cursor:pointer;font-size:14px}
.scene.active{background:#284c86;border-color:#7aa8ed}.scene small{display:block;color:#cbd5e1;margin-top:4px;font-size:12px}
.viewer{flex:1;min-width:0;position:relative}#panorama{width:100%;height:100%}
.mobile{display:none}
@media(max-width:760px){.shell{display:block;position:relative}.side{display:none}.viewer{height:100dvh}.mobile{display:flex;position:absolute;z-index:10;left:12px;right:12px;top:12px;align-items:center;gap:10px;background:#0b1220e8;padding:10px 12px;border:1px solid #475569;border-radius:12px;backdrop-filter:blur(8px)}.mobile b{font-size:14px;white-space:nowrap}.mobile select{min-width:0;flex:1;background:#1e293b;color:#fff;border:1px solid #475569;border-radius:8px;padding:9px}}
.pnlm-container{background:#111827}
</style></head><body>
<div class="mobile"><b>境游 · 全景</b><select id="mobileSelect"><option value="scene1">01 餐厅主区</option><option value="scene2">02 餐厅走道</option><option value="scene3">03 主区反向视角</option><option value="scene4">04 后场过道</option></select></div>
<div class="shell"><aside class="side"><div class="brand">境游</div><div class="sub">餐饮空间 · 360° 全景漫游<br>拖动环顾空间，滚轮或双指缩放。选择左侧场景切换不同机位。</div>
<button class="scene active" data-scene="scene1">01 · 餐厅主区<small>收银台、饮料柜与卡座区域</small></button>
<button class="scene" data-scene="scene2">02 · 餐厅走道<small>纵深就餐区与入口方向</small></button>
<button class="scene" data-scene="scene3">03 · 主区反向视角<small>餐厅内部另一机位</small></button>
<button class="scene" data-scene="scene4">04 · 后场过道<small>楼梯、门区与通道</small></button>
</aside><main class="viewer"><div id="panorama"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
const config = {
  "default":{"firstScene":"scene1","autoLoad":true,"showControls":true,"sceneFadeDuration":500,"hfov":105},
  "scenes":{"scene1": {"title": "餐厅主区 · 收银台与就餐区", "panorama": "images/scene1.jpg", "hfov": 105}, "scene2": {"title": "餐厅走道 · 纵深就餐区", "panorama": "images/scene2.jpg", "hfov": 105}, "scene3": {"title": "餐厅主区 · 反向视角", "panorama": "images/scene3.jpg", "hfov": 105}, "scene4": {"title": "后场过道 · 楼梯与门区", "panorama": "images/scene4.jpg", "hfov": 105}}
};
const viewer=pannellum.viewer("panorama",config);
function activate(id){document.querySelectorAll(".scene").forEach(b=>b.classList.toggle("active",b.dataset.scene===id));document.getElementById("mobileSelect").value=id;}
document.querySelectorAll(".scene").forEach(b=>b.addEventListener("click",()=>{viewer.loadScene(b.dataset.scene);activate(b.dataset.scene)}));
document.getElementById("mobileSelect").addEventListener("change",e=>{viewer.loadScene(e.target.value);activate(e.target.value)});
viewer.on("scenechange",activate);
</script></body></html>
