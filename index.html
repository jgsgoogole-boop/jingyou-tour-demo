<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>境游 · 全景漫游演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f8fafc;font:16px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}.top{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;background:#0b1220}.brand{font-size:20px;font-weight:700}.tag{font-size:12px;color:#a5b4fc;border:1px solid #475569;border-radius:99px;padding:4px 10px}.wrap{max-width:1100px;margin:auto;padding:22px}.viewer{height:min(65vh,560px);min-height:330px;position:relative;overflow:hidden;border-radius:18px;background:#c7d2d7;cursor:grab;touch-action:pan-y;box-shadow:0 18px 60px #0006}.viewer:active{cursor:grabbing}.panorama{position:absolute;inset:0;width:180%;height:100%;background:linear-gradient(180deg,#a9c5d3 0 42%,#e4d7c5 42% 46%,#9a826d 46% 100%);transition:transform .08s linear}.room{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 7%,#f1eee6 7% 10%,transparent 10% 30%,#f4f1e9 30% 33%,transparent 33% 67%,#eee9df 67% 70%,transparent 70% 90%,#f1eee6 90% 93%,transparent 93%),linear-gradient(0deg,#6e6259 0 4%,#c2b5a4 4% 8%,transparent 8% 48%,#d6c7b5 48% 51%,transparent 51%)}.window{position:absolute;top:12%;height:34%;width:19%;background:linear-gradient(180deg,#86b8d0,#d3e5e8);border:12px solid #eee9df;box-shadow:0 4px 10px #0002}.w1{left:15%}.w2{left:57%}.sofa{position:absolute;bottom:10%;left:31%;width:38%;height:22%;background:#9b7962;border-radius:20px 20px 8px 8px;box-shadow:inset 0 10px #b9987f}.table{position:absolute;bottom:7%;left:42%;width:18%;height:5%;border-radius:50%;background:#725b48}.hot{position:absolute;border:2px solid white;background:#4f46e5;color:white;width:42px;height:42px;border-radius:50%;font-size:21px;box-shadow:0 4px 16px #0008;cursor:pointer}.h1{left:49%;top:53%}.h2{left:78%;top:65%}.hint{position:absolute;bottom:16px;left:16px;background:#111827b9;padding:8px 12px;border-radius:10px;font-size:13px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.controls button{border:1px solid #475569;background:#1e293b;color:#fff;border-radius:12px;padding:10px 16px;cursor:pointer}.controls button.active{background:#4f46e5;border-color:#818cf8}.note{color:#cbd5e1;font-size:14px}.foot{margin-top:22px;color:#94a3b8;font-size:12px}
</style></head><body><header class="top"><div class="brand">境游 · 全景漫游</div><span class="tag">独立托管演示</span></header>
<main class="wrap"><h1 id="title">现代住宅 · 客厅</h1><p class="note">拖动画面环顾空间，点击紫色热点切换场景。此页面用于验证独立托管与交互流程。</p>
<div class="viewer" id="viewer"><div class="panorama" id="pan"><div class="room"></div><div class="window w1"></div><div class="window w2"></div><div class="sofa"></div><div class="table"></div></div><button class="hot h1" id="hot1" aria-label="切换到餐厅">↗</button><button class="hot h2" id="hot2" aria-label="切换到卧室">↗</button><div class="hint">按住拖动 · 滚轮缩放 · 点击热点切换</div></div>
<div class="controls"><button class="active" data-scene="0">01 客厅</button><button data-scene="1">02 餐厅</button><button data-scene="2">03 卧室</button><button id="reset">重置视角</button></div>
<p class="note" id="desc">客厅：以中性色材质与大面积采光为主的空间示意。</p>
<div class="foot">境游全景漫游 · 独立静态托管测试版。正式项目请在编辑器中导出包含真实全景素材的独立网页。</div></main>
<script>
const viewer=document.getElementById('viewer'),pan=document.getElementById('pan'),title=document.getElementById('title'),desc=document.getElementById('desc');let scene=0,x=0,down=false,start=0,base=0,scale=1;
const data=[['现代住宅 · 客厅','客厅：以中性色材质与大面积采光为主的空间示意。'],['现代住宅 · 餐厅','餐厅：通过材质和家具布置展示空间关系。'],['现代住宅 · 卧室','卧室：以柔和色调和舒适氛围为主的空间示意。']];
function setScene(n){scene=n;title.textContent=data[n][0];desc.textContent=data[n][1];document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',+b.dataset.scene===n));x=0;render()}
function render(){pan.style.transform='translateX('+x+'px) scale('+scale+')'}
viewer.addEventListener('pointerdown',e=>{down=true;start=e.clientX;base=x;viewer.setPointerCapture(e.pointerId)});viewer.addEventListener('pointermove',e=>{if(down){x=Math.max(-viewer.clientWidth*.8,Math.min(0,base+e.clientX-start));render()}});viewer.addEventListener('pointerup',()=>down=false);viewer.addEventListener('pointercancel',()=>down=false);viewer.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(1,Math.min(1.6,scale+(e.deltaY<0?.05:-.05)));render()},{passive:false});
document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>setScene(+b.dataset.scene)));document.getElementById('hot1').onclick=()=>setScene(1);document.getElementById('hot2').onclick=()=>setScene(2);document.getElementById('reset').onclick=()=>{x=0;scale=1;render()};setScene(0);
</script></body></html>
